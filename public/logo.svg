<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Candy">
  <title>Candy</title>
  <!--
    Candy brand badge — the red "c" and the confetti dots from the shop's
    printed artwork, on the cream the wordmark is printed on. The square badge
    is the companion to the "candy" wordmark, which the site draws inline in
    src/components/Logo.tsx.

    Every shape is a circle or a stroked arc, no text, so it rasterises
    identically wherever it is consumed (Google rich results, WhatsApp, app
    icons) instead of depending on the logo webfont being available.

    The "c" sits on the cream directly rather than reversed out of a red disc:
    a white letter inside a filled circle reads as a © at favicon sizes.
    The dots arc over its opening, echoing the arc above the wordmark.
  -->
  <circle cx="256" cy="256" r="256" fill="#FDFBF8"/>
  <!-- The "c": a thick arc with the gap on the right and round terminals.
       Stroke is 38% of the outer diameter, the same stroke-to-x-height ratio
       the wordmark's own "c" has, so badge and wordmark carry equal weight.
       The aperture is 110 degrees — close to the wordmark's own tight
       opening, but wide enough that the gap survives a 32px favicon
       rather than closing up into an "o". -->
  <path d="M293.9 185.0 A 94 94 0 1 0 293.9 339.0"
        fill="none" stroke="#E1252B" stroke-width="116" stroke-linecap="round"/>
  <!-- Confetti wrapping the opening. -->
  <circle cx="150" cy="74"  r="26" fill="#22B24C"/>
  <circle cx="243" cy="48"  r="20" fill="#FDC10D"/>
  <circle cx="330" cy="76"  r="27" fill="#E1252B"/>
  <circle cx="405" cy="140" r="20" fill="#22B24C"/>
  <circle cx="432" cy="252" r="26" fill="#FDC10D"/>
  <circle cx="398" cy="366" r="20" fill="#E1252B"/>
  <circle cx="96"  cy="388" r="22" fill="#FDC10D"/>
</svg>
